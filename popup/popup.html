<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Autofill</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>Smart Autofill</h1>
    <p class="intro">Your profile stays in this browser.</p>
    <form id="profile-form">
      <label>Full name<input name="name" autocomplete="name" placeholder="Your full name"></label>
      <label>Email<input name="email" type="email" autocomplete="email" placeholder="you@example.com"></label>
      <label>Phone number<input name="phone" type="tel" autocomplete="tel" placeholder="+91 ..."></label>
      <label>College<input name="college" placeholder="College or university"></label>
      <label>Roll number<input name="rollNumber" placeholder="Your roll number"></label>
      <label>Address<textarea name="address" rows="2" autocomplete="street-address" placeholder="Your address"></textarea></label>
      <div class="actions">
        <button type="submit" class="primary">Save profile</button>
        <button type="button" id="clear" class="secondary">Clear</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
    <p class="note">Review each answer before submitting a form. Avoid saving sensitive information you don't need.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
